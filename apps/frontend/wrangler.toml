#:schema node_modules/wrangler/config-schema.json
# Cloudflare Worker with static assets for the SvelteKit frontend (@sveltejs/adapter-cloudflare).
# `pnpm build` writes the Worker and the static assets to .svelte-kit/cloudflare.
#
# The PUBLIC_* settings (PUBLIC_API_BASE_URL, PUBLIC_PRODUCTION_COOKIE_DOMAIN, PUBLIC_MAPBOX_*) come
# from $env/static/public and are inlined by `vite build`. They are build-time variables, not Worker
# vars, so they do not belong here. Never put secrets or tokens in this file.

name = "bytebunker-frontend"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-10-19"
# SvelteKit needs AsyncLocalStorage (node:async_hooks); the SSR bundle uses no other Node APIs.
compatibility_flags = ["nodejs_als"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = true
