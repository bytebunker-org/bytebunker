<!doctype html>
<html lang="%LANG%" data-theme="emerald">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon/favicon.svg" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/favicon/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="ByteBunker" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Polyfill reflect-metadata before any bundled code runs (Rolldown/Vite 8 lazily wraps the
		     CJS reflect-metadata module, so class-transformer DTOs from @bytebunker/backend can run
		     before it initialises). See also the explicit imports in hooks + +layout.ts. -->
		<script src="/reflect-metadata.js"></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
