# Every config entry can be set via an environment variable

NODE_ENV = "production"
hostName = "0.0.0.0"
port = 12100
nodeEnv = "production"
# frontendUrl = ""

[cors]
# endpoint = []

[serviceAlternatives]
PrimaryAssetStorageProvider = "S3AssetStorageService"
SidecarAssetStorageProvider = "S3AssetStorageService"
PipelineAssetStorageProvider = "S3AssetStorageService"

[mikroOrm]
# host = "127.0.0.1"
port = 5432
user = "bytebunker"
# password = ""
database = "bytebunker"
logging = ["schema", "discovery", "info", "deprecated"]
# logging = ["info"]
entities = ["./dist/**/*.entity.js"]
entitiesTs = ["./src/**/*.entity.ts"]

[neo4j]
# connectionString = "bolt://127.0.0.1:7687"
username = "neo4j"
# password = ""

[redis]
# host = "127.0.0.1"
port = 6379

[minio]
# endPoint = "127.0.0.1"
port = 443
useSSL = true
# accessKey = ""
# secretKey = ""

[mailer]
provider = "smtp"
senderName = ""
senderAddress = ""
host = ""
port = 587
secure = true
username = ""
password = ""

[session]
# secret = ""
cookieMaxAge = 60_000_0000
cookieSameSite = "strict"
