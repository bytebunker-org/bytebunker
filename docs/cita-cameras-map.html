<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxembourg CITA Highway Cameras</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #eee; }
    #map { width: 100%; height: 100vh; }
    .camera-popup { min-width: 300px; }
    .camera-popup h3 { margin: 0 0 8px; font-size: 14px; color: #333; }
    .camera-popup .cam-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      background: #222;
      cursor: pointer;
    }
    .camera-popup .cam-link {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: #0066cc;
    }
    .camera-popup .cam-meta {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
    .leaflet-popup-content-wrapper { border-radius: 8px; }
    .info-box {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(26, 26, 46, 0.9);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      max-width: 260px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .info-box h2 { font-size: 15px; margin-bottom: 6px; }
    .info-box .count { color: #4fc3f7; font-weight: bold; }
    .highway-legend { margin-top: 8px; }
    .highway-legend span {
      display: inline-block;
      padding: 2px 8px;
      margin: 2px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      opacity: 0.9;
    }
    .highway-legend span:hover { opacity: 1; transform: scale(1.05); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info-box">
    <h2>CITA Highway Cameras</h2>
    <div>Luxembourg motorway network</div>
    <div style="margin-top:4px"><span class="count" id="cam-count">Loading...</span> cameras</div>
    <div class="highway-legend" id="legend"></div>
    <div style="margin-top:8px;font-size:11px;color:#888">Click a marker to see the live camera image. Data: <a href="https://data.public.lu/en/datasets/cita-cameras-autoroute/" style="color:#4fc3f7" target="_blank">data.public.lu</a></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const HIGHWAY_COLORS = {
      'A1': '#e53935',
      'A3': '#43a047',
      'A4': '#1e88e5',
      'A6': '#fb8c00',
      'A7': '#8e24aa',
      'A13': '#00acc1',
    };

    const map = L.map('map').setView([49.65, 6.15], 11);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    function createCameraIcon(highway) {
      const color = HIGHWAY_COLORS[highway] || '#999';
      return L.divIcon({
        className: 'camera-marker',
        html: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="${color}" stroke="white" stroke-width="2" opacity="0.9"/>
          <path d="M8 9h5v6H8zM13 10l3-1.5v7L13 14z" fill="white"/>
        </svg>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        popupAnchor: [0, -14]
      });
    }

    function getCameraImageUrl(cameraId) {
      return `https://www.cita.lu/info_trafic/cameras/images/cccam_${cameraId}.jpg`;
    }

    function getCameraPageUrl(cameraId) {
      return `https://www.cita.lu/webcam/map/${cameraId}/full/en`;
    }

    async function loadKML() {
      try {
        const response = await fetch('https://www.cita.lu/kml/cameras.kml');
        const text = await response.text();
        const parser = new DOMParser();
        const kml = parser.parseFromString(text, 'text/xml');
        const placemarks = kml.querySelectorAll('Placemark');

        const cameras = [];
        const highwayCounts = {};

        placemarks.forEach(pm => {
          const name = pm.querySelector('name')?.textContent?.trim() || '';
          const coords = pm.querySelector('coordinates')?.textContent?.trim() || '';
          const desc = pm.querySelector('description')?.textContent || '';

          if (!coords) return;

          const [lon, lat] = coords.split(',').map(Number);
          if (isNaN(lat) || isNaN(lon)) return;

          // Extract camera ID from description iframe or name
          const idMatch = desc.match(/webcam\/map\/(\d+)/) || name.match(/Camera\s+(\d+)/i);
          const cameraId = idMatch ? idMatch[1] : null;

          // Extract highway from name
          const hwMatch = name.match(/^(A\d+)/);
          const highway = hwMatch ? hwMatch[1] : 'Unknown';

          highwayCounts[highway] = (highwayCounts[highway] || 0) + 1;

          cameras.push({ name, lat, lon, cameraId, highway });
        });

        // Add markers
        cameras.forEach(cam => {
          const icon = createCameraIcon(cam.highway);
          const marker = L.marker([cam.lat, cam.lon], { icon }).addTo(map);

          const imgUrl = cam.cameraId ? getCameraImageUrl(cam.cameraId) : '';
          const pageUrl = cam.cameraId ? getCameraPageUrl(cam.cameraId) : '';

          const popupContent = `
            <div class="camera-popup">
              <h3>${cam.name}</h3>
              ${imgUrl ? `<img class="cam-img" src="${imgUrl}" alt="${cam.name}"
                onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22><rect fill=%22%23333%22 width=%22300%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23888%22 text-anchor=%22middle%22 dy=%22.3em%22 font-family=%22sans-serif%22>No image available</text></svg>'"
                onclick="window.open('${imgUrl}', '_blank')"
              />` : '<div style="color:#888;padding:20px">No image URL</div>'}
              ${pageUrl ? `<a class="cam-link" href="${pageUrl}" target="_blank">Open full camera view</a>` : ''}
              <div class="cam-meta">${cam.lat.toFixed(5)}, ${cam.lon.toFixed(5)}</div>
            </div>
          `;

          marker.bindPopup(popupContent, { maxWidth: 350 });
        });

        // Update counter
        document.getElementById('cam-count').textContent = cameras.length;

        // Build legend
        const legend = document.getElementById('legend');
        Object.entries(highwayCounts)
          .sort((a, b) => a[0].localeCompare(b[0]))
          .forEach(([hw, count]) => {
            const span = document.createElement('span');
            span.style.background = HIGHWAY_COLORS[hw] || '#666';
            span.style.color = 'white';
            span.textContent = `${hw} (${count})`;
            legend.appendChild(span);
          });

        // Fit bounds
        if (cameras.length > 0) {
          const bounds = L.latLngBounds(cameras.map(c => [c.lat, c.lon]));
          map.fitBounds(bounds, { padding: [30, 30] });
        }

      } catch (err) {
        console.error('Failed to load KML:', err);
        document.getElementById('cam-count').textContent = 'Error loading';
      }
    }

    loadKML();
  </script>
</body>
</html>
